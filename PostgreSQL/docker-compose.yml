services:
  db:
    image: postgres:15
    container_name: hms-t02-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hms
      POSTGRES_USER: hms_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_change_me}
    ports:
      - "5432:5432"
    volumes:
      - hms_pgdata:/var/lib/postgresql/data
      - ./database/migrations/001_create_core_tables.sql:/docker-entrypoint-initdb.d/001_create_core_tables.sql:ro
      - ./database/migrations/002_indexes_and_integrity.sql:/docker-entrypoint-initdb.d/002_indexes_and_integrity.sql:ro
      - ./database/migrations/003_seed_development_data.sql:/docker-entrypoint-initdb.d/003_seed_development_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hms_app -d hms"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  hms_pgdata:

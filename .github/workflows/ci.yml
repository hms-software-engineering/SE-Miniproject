name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- Linux ----------
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev libpq-dev nlohmann-json3-dev libargon2-dev

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cmake --build build --config Release --parallel 4

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: ctest --test-dir build -C Release --output-on-failure

      # ---------- Windows (MSYS2 UCRT64) ----------
      # Three setup attempts + cache: the action’s built-in retry is only
      # two tries and often misses a slow mirror.  Once one run succeeds,
      # the cache makes future runs skip the network entirely.
      - name: Setup MSYS2 (attempt 1)
        id: msys2_attempt1
        if: runner.os == 'Windows'
        continue-on-error: true
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false          # avoid the fragile internal pacman -Syuu
          cache: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-argon2
            mingw-w64-ucrt-x86_64-postgresql

      - name: Setup MSYS2 (retry 1)
        id: msys2_attempt2
        if: runner.os == 'Windows' && steps.msys2_attempt1.outcome == 'failure'
        continue-on-error: true
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          cache: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-argon2
            mingw-w64-ucrt-x86_64-postgresql

      - name: Setup MSYS2 (retry 2 – final)
        if: runner.os == 'Windows' && steps.msys2_attempt1.outcome == 'failure' && steps.msys2_attempt2.outcome == 'failure'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          cache: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-argon2
            mingw-w64-ucrt-x86_64-postgresql

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$MSYSTEM_PREFIX"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake --build build --config Release --parallel 4

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ctest --test-dir build -C Release --output-on-failure
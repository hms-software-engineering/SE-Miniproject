name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev libpq-dev nlohmann-json3-dev libargon2-dev qt6-base-dev libgl1-mesa-dev libxkbcommon-dev

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-argon2
            mingw-w64-ucrt-x86_64-postgresql
            mingw-w64-ucrt-x86_64-qt6-base

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$MSYSTEM_PREFIX"
        
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cmake --build build --config Release --parallel 4

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --parallel 4
        shell: pwsh

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ctest --test-dir build -C Release --output-on-failure

      # HMS-NF-007: the Qt client must build on Ubuntu 22.04 (GCC 11) and Windows.
      - name: Check Qt client was built
        shell: bash
        run: |
          test -f build/hms_client || test -f build/hms_client.exe || { echo "hms_client was not built"; exit 1; }
          grep -E 'CMAKE_CXX_COMPILER_(ID|VERSION):' build/CMakeCache.txt || true

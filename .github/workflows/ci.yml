name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ubuntu dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libssl-dev \
            libpq-dev \
            libpqxx-dev \
            nlohmann-json3-dev \
            libcpp-httplib-dev \
            libargon2-dev

      - name: Install Windows dependencies via vcpkg (CI runner internal only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # This runs strictly inside the GitHub Actions runner to satisfy Windows 
          # missing development headers, without touching your repo code or local files.
          vcpkg install libpqxx:x64-windows cpp-httplib:x64-windows nlohmann-json:x64-windows argon2:x64-windows openssl:x64-windows

      - name: Configure on Ubuntu
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Configure on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake `
            -S . `
            -B build `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Run tests
        run: ctest --test-dir build --config Release --output-on-failure

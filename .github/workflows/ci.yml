name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and test (${{ matrix.os }})

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-latest

    env:
      VCPKG_DISABLE_METRICS: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ubuntu build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libssl-dev \
            libpq-dev

      - name: Bootstrap vcpkg on Ubuntu
        if: runner.os == 'Linux'
        shell: bash
        run: |
          git clone --depth 1 \
            https://github.com/microsoft/vcpkg.git \
            "$RUNNER_TEMP/vcpkg"

          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" \
            -disableMetrics

      - name: Bootstrap vcpkg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone --depth 1 `
            https://github.com/microsoft/vcpkg.git `
            "$env:RUNNER_TEMP\vcpkg"

          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" `
            -disableMetrics

      - name: Install vcpkg dependencies on Ubuntu
        if: runner.os == 'Linux'
        shell: bash
        run: |
          "$RUNNER_TEMP/vcpkg/vcpkg" install \
            --triplet x64-linux

      - name: Install vcpkg dependencies on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\vcpkg\vcpkg.exe" install `
            --triplet x64-windows

          "$env:RUNNER_TEMP\vcpkg\installed\x64-windows\bin" |
            Out-File `
              -FilePath $env:GITHUB_PATH `
              -Encoding utf8 `
              -Append

      - name: Configure on Ubuntu
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake `
            -S . `
            -B build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DVCPKG_TARGET_TRIPLET=x64-linux `
            -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Configure on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake `
            -S . `
            -B build `
            -A x64 `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_TOOLCHAIN_FILE="$env:RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Run tests
        run: ctest --test-dir build --config Release --output-on-failure
